<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №4: HTML-форми</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 720px;
        margin: 24px auto;
        padding: 0 16px;
        line-height: 1.6;
      }
      .field {
        margin-bottom: 12px;
      }
      fieldset {
        margin: 14px 0;
        padding: 10px 14px;
      }
      img {
        max-width: 100%;
        height: auto;
        margin-top: 20px;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Моя перша HTML-форма</h1>

    <form action="https://httpbin.org/get" method="get">
      <!-- Спосіб 1: label з використанням атрибута for та id -->
      <div class="field">
        <label for="user_name">Ім'я:</label>
        <input type="text" id="user_name" name="user_name" required>
      </div>

      <div class="field">
        <label for="user_birthdate">Дата народження:</label>
        <input type="date" id="user_birthdate" name="user_birthdate">
      </div>

      <!-- Спосіб 2: просте огортання input тегом label -->
      <div class="field">
        <label>
          Імейл:
          <input type="email" name="user_email" required>
        </label>
      </div>

      <div class="field">
        <label>
          Повідомлення:
          <textarea name="user_message" rows="3" cols="30"></textarea>
        </label>
      </div>

      <fieldset>
        <legend>Ваші улюблені напої?</legend>
        <label><input type="checkbox" name="drinks" value="coffee"> Кава</label>
        <label><input type="checkbox" name="drinks" value="tea"> Чай</label>
        <label><input type="checkbox" name="drinks" value="juice"> Сік</label>
        <label><input type="checkbox" name="drinks" value="water"> Вода</label>
      </fieldset>

      <fieldset>
        <legend>Моя національність</legend>
        <label><input type="radio" name="nationality" value="ukrainian" checked> Українець / Українка</label>
        <label><input type="radio" name="nationality" value="polish"> Поляк / Полька</label>
        <label><input type="radio" name="nationality" value="other"> Інша</label>
      </fieldset>

      <div class="field">
        <button type="submit">Надіслати</button>
        <button type="reset">Очистити</button>
      </div>
    </form>

    <picture>
      <source media="(max-width: 467px)" srcset="https://picsum.photos/300/500">
      <img src="https://picsum.photos/1000/400" alt="Демонстраційне зображення">
    </picture>
  </body>
</html>
